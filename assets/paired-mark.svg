<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="PAIRED interlock mark">
  <title>PAIRED — interlock mark: a brushstroke and a soundwave, interlocked</title>
  <defs>
    <linearGradient id="prismG" x1="0" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF5C8A"/><stop offset=".25" stop-color="#FFB84D"/>
      <stop offset=".5" stop-color="#AFED66"/><stop offset=".75" stop-color="#39D0C4"/>
      <stop offset="1" stop-color="#8B7CFF"/>
    </linearGradient>
  </defs>
  <!-- brushstroke arc: a painter's swoosh sweeping the left and bottom -->
  <path d="M46 8 C26 4 8 20 9.5 36 C10.8 49 20 57 31 58.5" stroke="url(#prismG)" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M31 58.5 C26 60.5 20 61 15.5 59.5" stroke="url(#prismG)" stroke-width="2.6" stroke-linecap="round" opacity=".75"/>
  <!-- soundwave arc: bars riding the right side, interlocking through the brushstroke -->
  <g stroke="url(#prismG)" stroke-width="4" stroke-linecap="round">
    <line x1="40" y1="18" x2="40" y2="30"/>
    <line x1="47.5" y1="23" x2="47.5" y2="41"/>
    <line x1="55" y1="27" x2="55" y2="37"/>
  </g>
  <!-- the meeting point -->
  <circle cx="33" cy="32" r="3.4" fill="#AFED66"/>
</svg>
